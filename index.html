<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monsieur Toujours Raison 😈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div id="root" class="w-full max-w-2xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
      const [showSettings, setShowSettings] = useState(!apiKey);
      const [messages, setMessages] = useState([
        { role: 'model', text: "Dis-moi n'importe quoi. Une vérité absolue, une opinion, un fait scientifique... Je vais te prouver que tu as tort." }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      const saveKey = (key) => {
        setApiKey(key);
        localStorage.setItem('gemini_key', key);
        setShowSettings(false);
      };

      const sendMessage = async () => {
        if (!input.trim() || loading) return;
        if (!apiKey) return setShowSettings(true);

        const userText = input.trim();
        const newMessages = [...messages, { role: 'user', text: userText }];
        setMessages(newMessages);
        setInput('');
        setLoading(true);

        const systemPrompt = `
Tu es "Monsieur Toujours Raison", un chatbot d'esprit brillant, cynique, joueur et spécialiste du second degré.
Ton SEUL ET UNIQUE OBJECTIF est de prouver à l'utilisateur qu'il a TORT, peu importe ce qu'il dit.

Règles de comportement :
1. Même si l'utilisateur dit une vérité scientifique absolue (ex: "La Terre est ronde", "L'eau ça mouille", "1+1=2"), tu DOIS trouver une contre-argumentation tordue, jouer sur l'étymologie, la physique quantique, la philosophie, le contexte ou la sémantique pour lui prouver qu'il a tort.
2. Utilise la mauvaise foi, le jeu sur les mots, les paradoxes, la logique poussée à l'absurde, ou les exceptions extrêmes.
3. Reste toujours divertissant, sarcastique, piquant mais amusant.
4. Tes réponses doivent être concises (2 à 4 phrases max), percutantes et convaincantes en apparence.
        `;

        try {
          const contents = [
            { parts: [{ text: systemPrompt }] },
            ...newMessages.map(m => ({
              role: m.role,
              parts: [{ text: m.text }]
            }))
          ];

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);

          const reply = data.candidates[0].content.parts[0].text;
          setMessages([...newMessages, { role: 'model', text: reply }]);
        } catch (err) {
          setMessages([...newMessages, { role: 'model', text: `Erreur : ${err.message}. Vérifie ta clé API !` }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="bg-slate-900 border border-red-900/50 rounded-2xl shadow-2xl flex flex-col h-[85vh] overflow-hidden w-full">
          {/* Header */}
          <header className="bg-red-950/40 border-b border-red-900/40 p-4 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <span className="text-3xl">😈</span>
              <div>
                <h1 className="font-extrabold text-red-500 text-lg">Monsieur Toujours Raison</h1>
                <p className="text-xs text-slate-400">Spoiler : Tu as déjà tort.</p>
              </div>
            </div>
            <button 
              onClick={() => setShowSettings(!showSettings)}
              className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-700 transition"
            >
              ⚙️ Clé API
            </button>
          </header>

          {/* Modal Clé API */}
          {showSettings && (
            <div className="p-4 bg-slate-800 border-b border-slate-700 space-y-3">
              <p className="text-xs text-slate-300">Entre ta clé API Gemini pour pouvoir débattre :</p>
              <div className="flex gap-2">
                <input 
                  type="password" 
                  placeholder="Clé API Gemini (AIzaSy...)" 
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="flex-1 bg-slate-900 border border-slate-700 p-2 text-sm rounded-lg text-white"
                />
                <button 
                  onClick={() => saveKey(apiKey)}
                  className="bg-red-600 hover:bg-red-500 text-sm px-4 py-2 rounded-lg font-medium transition"
                >
                  OK
                </button>
              </div>
            </div>
          )}

          {/* Zone de Chat */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {messages.map((m, idx) => (
              <div 
                key={idx} 
                className={`flex gap-3 ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}
              >
                {m.role === 'model' && <div className="text-2xl shrink-0">😈</div>}
                <div 
                  className={`p-3.5 rounded-2xl max-w-[80%] text-sm leading-relaxed ${
                    m.role === 'user' 
                      ? 'bg-red-600 text-white rounded-br-none' 
                      : 'bg-slate-800 text-slate-200 border border-slate-700/60 rounded-bl-none'
                  }`}
                >
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex gap-3 justify-start items-center">
                <div className="text-2xl">😈</div>
                <div className="bg-slate-800 border border-slate-700 p-3 rounded-2xl text-xs text-red-400 animate-pulse">
                  Recherche d'une faille logique dans ce que tu viens de dire...
                </div>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>

          {/* Saisie */}
          <div className="p-4 bg-slate-950 border-t border-slate-800 flex gap-2">
            <input 
              type="text" 
              placeholder="Affirme quelque chose (ex: 'Je respire')..."
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
              className="flex-1 bg-slate-900 border border-slate-800 focus:border-red-600 focus:outline-none p-3 text-sm rounded-xl text-white transition"
            />
            <button 
              onClick={sendMessage}
              disabled={loading}
              className="bg-red-600 hover:bg-red-500 disabled:opacity-50 px-5 rounded-xl text-sm font-semibold transition"
            >
              Lancer
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
